<svg width="40" height="40" viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg">
  <g fill="#c79e72" stroke="#3f352e" stroke-width="1">
    <!-- Truck cabin -->
    <rect x="2" y="15" width="12" height="10" rx="1"/>
    
    <!-- Truck body/container -->
    <rect x="14" y="12" width="20" height="13" rx="1"/>
    
    <!-- Windshield -->
    <rect x="3" y="16" width="10" height="4" fill="#9c9c7c" opacity="0.7"/>
    
    <!-- Front bumper -->
    <rect x="1" y="18" width="2" height="4" rx="1"/>
    
    <!-- Wheels -->
    <circle cx="8" cy="28" r="3" fill="#3f352e"/>
    <circle cx="8" cy="28" r="1.5" fill="#9c948c"/>
    
    <circle cx="18" cy="28" r="3" fill="#3f352e"/>
    <circle cx="18" cy="28" r="1.5" fill="#9c948c"/>
    
    <circle cx="30" cy="28" r="3" fill="#3f352e"/>
    <circle cx="30" cy="28" r="1.5" fill="#9c948c"/>
    
    <!-- Headlight -->
    <circle cx="2.5" cy="20" r="1" fill="#9c9c7c"/>
    
    <!-- Side details -->
    <line x1="16" y1="15" x2="32" y2="15" stroke="#9c948c" stroke-width="0.5"/>
    <line x1="16" y1="20" x2="32" y2="20" stroke="#9c948c" stroke-width="0.5"/>
    
    <!-- Door handle -->
    <rect x="6" y="19" width="1" height="2" fill="#9c948c"/>
  </g>
</svg>
