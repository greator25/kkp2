<svg width="50" height="50" viewBox="0 0 50 50" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#c79e72;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3f352e;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="25" cy="25" r="24" fill="url(#logoGradient)" stroke="#9c948c" stroke-width="1"/>
  
  <!-- Inner circle -->
  <circle cx="25" cy="25" r="18" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.3"/>
  
  <!-- Truck silhouette -->
  <g transform="translate(10, 18)" fill="#ffffff">
    <!-- Cabin -->
    <rect x="0" y="6" width="8" height="6" rx="1"/>
    
    <!-- Container -->
    <rect x="8" y="4" width="14" height="8" rx="1"/>
    
    <!-- Wheels -->
    <circle cx="4" cy="14" r="2"/>
    <circle cx="12" cy="14" r="2"/>
    <circle cx="18" cy="14" r="2"/>
    
    <!-- Windshield -->
    <rect x="1" y="7" width="6" height="3" fill="#9c9c7c" opacity="0.8"/>
  </g>
  
  <!-- Company initials -->
  <text x="25" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" font-weight="bold" fill="#ffffff" opacity="0.9">KKP</text>
  
  <!-- Decorative elements -->
  <g stroke="#ffffff" stroke-width="0.5" fill="none" opacity="0.3">
    <circle cx="25" cy="25" r="21"/>
    <circle cx="25" cy="25" r="15"/>
  </g>
  
  <!-- Corner decorations -->
  <g fill="#ffffff" opacity="0.2">
    <circle cx="15" cy="15" r="1"/>
    <circle cx="35" cy="15" r="1"/>
    <circle cx="15" cy="35" r="1"/>
    <circle cx="35" cy="35" r="1"/>
  </g>
</svg>
