<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="indianPattern" x="0" y="0" width="100" height="100" patternUnits="userSpaceOnUse">
      <!-- Mandala-style pattern with Indian motifs -->
      <rect width="100" height="100" fill="#faf8f5" opacity="0.3"/>
      
      <!-- Central lotus flower -->
      <g transform="translate(50,50)">
        <circle cx="0" cy="0" r="15" fill="none" stroke="#c79e72" stroke-width="1" opacity="0.3"/>
        <circle cx="0" cy="0" r="8" fill="none" stroke="#9c9c7c" stroke-width="0.5" opacity="0.2"/>
        
        <!-- Lotus petals -->
        <g opacity="0.15">
          <ellipse cx="0" cy="-10" rx="3" ry="8" fill="#c79e72" transform="rotate(0)"/>
          <ellipse cx="0" cy="-10" rx="3" ry="8" fill="#c79e72" transform="rotate(45)"/>
          <ellipse cx="0" cy="-10" rx="3" ry="8" fill="#c79e72" transform="rotate(90)"/>
          <ellipse cx="0" cy="-10" rx="3" ry="8" fill="#c79e72" transform="rotate(135)"/>
          <ellipse cx="0" cy="-10" rx="3" ry="8" fill="#c79e72" transform="rotate(180)"/>
          <ellipse cx="0" cy="-10" rx="3" ry="8" fill="#c79e72" transform="rotate(225)"/>
          <ellipse cx="0" cy="-10" rx="3" ry="8" fill="#c79e72" transform="rotate(270)"/>
          <ellipse cx="0" cy="-10" rx="3" ry="8" fill="#c79e72" transform="rotate(315)"/>
        </g>
        
        <!-- Inner circle -->
        <circle cx="0" cy="0" r="3" fill="#9c948c" opacity="0.2"/>
      </g>
      
      <!-- Corner decorative elements -->
      <g opacity="0.1">
        <circle cx="15" cy="15" r="4" fill="#3f352e"/>
        <circle cx="85" cy="15" r="4" fill="#3f352e"/>
        <circle cx="15" cy="85" r="4" fill="#3f352e"/>
        <circle cx="85" cy="85" r="4" fill="#3f352e"/>
      </g>
      
      <!-- Connecting lines -->
      <g stroke="#9c9c7c" stroke-width="0.5" opacity="0.1">
        <line x1="0" y1="50" x2="100" y2="50"/>
        <line x1="50" y1="0" x2="50" y2="100"/>
      </g>
      
      <!-- Small decorative dots -->
      <g fill="#c79e72" opacity="0.1">
        <circle cx="25" cy="25" r="1"/>
        <circle cx="75" cy="25" r="1"/>
        <circle cx="25" cy="75" r="1"/>
        <circle cx="75" cy="75" r="1"/>
      </g>
    </pattern>
  </defs>
  
  <rect width="200" height="200" fill="url(#indianPattern)"/>
</svg>
